[workspace]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
csv = "1.4.0"
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "query", "rustls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "fs"] }
url = "2.5.8"
httpmock = "0.8.3"
proptest = "1.11.0"

[package]
name = "kite"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/zerodha/kite-cli"

[lints]
workspace = true

[dependencies]
kiteconnect = "1.0.0"
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv.workspace = true
dirs = "6.0.0"
futures-util.workspace = true
ratatui = "0.30.2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "process"] }
uuid = { version = "=1.28.0", features = ["v4"] }
url.workspace = true

[dev-dependencies]
httpmock.workspace = true
proptest.workspace = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
