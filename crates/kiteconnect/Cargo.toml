[package]
name = "zerodha-kiteconnect"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Kite Connect API client for Rust: REST calls with typed responses and the WebSocket ticker"
readme = "README.md"
repository = "https://github.com/zerodha/kite-cli"
keywords = ["kite", "zerodha", "trading", "stock-market", "api"]
categories = ["api-bindings", "finance"]

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
csv.workspace = true
http = "1.4.0"
sha2 = "0.10.9"
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.20"
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url.workspace = true

[dev-dependencies]
httpmock.workspace = true
proptest.workspace = true
